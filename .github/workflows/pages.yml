name: Deploy demo to GitHub Pages
on:
  push:
    branches: [codex/pages-demo]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set resource paths for Pages
        run: |
          python - <<'PY'
          from pathlib import Path
          for file in ('src/io/loadData.js', 'src/layers/detail/tileLoader.js'):
              path = Path(file)
              text = path.read_text(encoding='utf-8')
              for resource in ('/dem.json', '/dem.bin', '/china_provinces_datav.json', '/tiles/'):
                  text = text.replace(resource, '/china-terrain-3d' + resource)
              path.write_text(text, encoding='utf-8')
          PY
      - run: npm run build -- --base=/china-terrain-3d/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
